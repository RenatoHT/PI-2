<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Mercado{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
        }

        body {
            margin: 0;
            background: #f4f4f4;
            color: #222;
            font-family: Arial, sans-serif;
        }

        /* Área principal */

        .app {
            width: 100%;
            max-width: 600px;
            min-height: 100vh;
            margin: 0 auto;
            background: #fff;
        }

        .content {
            padding: 16px;
        }

        /* Cabeçalho */

        .header {
            padding: 16px;
            background: #222;
            color: #fff;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
        }

        .header p {
            margin: 4px 0 0;
            font-size: 14px;
            opacity: 0.8;
        }

        /* Títulos */

        h2 {
            margin: 0 0 16px;
            font-size: 20px;
        }

        /* Formulários */

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            min-height: 48px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            background: #fff;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #222;
        }

        /* Botões */

        button,
        .button {
            width: 100%;
            min-height: 48px;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Cards */

        .card {
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #fff;
        }

        /* Lista */

        .list {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .list-item {
            padding: 14px 0;
            border-bottom: 1px solid #ddd;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        /* Espaçamentos */

        .section {
            margin-bottom: 24px;
        }

        /* Navegação */

        .nav {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            border-top: 1px solid #ddd;
            background: #fff;
        }

        .nav a {
            flex: 1;
            padding: 12px 8px;
            text-align: center;
            text-decoration: none;
            color: #222;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        /* Desktop */

        @media (min-width: 601px) {
            body {
                padding: 24px 0;
            }

            .app {
                min-height: calc(100vh - 48px);
                border-radius: 12px;
                overflow: hidden;
            }
        }


        #reader {
            width: 100%;
            margin: 0 auto;
            background: black;
            border-radius: 12px;
            overflow: hidden;
        }

        #reader video {
            width: 100% !important;
            height: 220px !important;
            object-fit: cover !important;
        }

        @media (max-width: 600px) {

            #reader video {
                height: 180px !important;
            }

        }
        </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

<div class="app">

    <header class="header">
        <h1>{% block header_title %}Mercado{% endblock %}</h1>

        <p>{% block header_subtitle %}{% endblock %}</p>
    </header>

    <main class="content">
        {% block content %}
        {% endblock %}
    </main>

    <nav class="nav">
        <a href="/mercado/stock/">Estoque</a>
        <a href="/mercado/scan/">Scanner</a>
    </nav>

</div>

{% block extra_js %}
{% endblock %}

</body>
</html>
