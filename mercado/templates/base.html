<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Mercado{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --color-primary: #222;
            --color-background: #f4f4f4;
            --color-surface: #fff;
            --color-border: #ddd;
            --color-text: #222;
            --color-muted: #666;
            --color-danger: #dc3545;
            --radius: 6px;
            --space-small: 8px;
            --space-medium: 12px;
            --space-large: 16px;
        }

        html {
            font-size: 16px;
        }

        body {
            margin: 0;
            background: var(--color-background);
            color: var(--color-text);
            font-family: Arial, sans-serif;
            line-height: 1.4;
        }

        /* Área principal */

        .app {
            width: 100%;
            max-width: 600px;
            min-height: 100vh;
            margin: 0 auto;
            background: var(--color-surface);
        }

        .content {
            padding: var(--space-large);
        }

        /* Cabeçalho */

        .header {
            padding: var(--space-large);
            background: var(--color-primary);
            color: #fff;
        }

        .header h1 {
            margin: 0;
            font-size: 21px;
            line-height: 1.3;
        }

        .header p {
            margin: 4px 0 0;
            font-size: 13px;
            opacity: 0.8;
        }

        /* Títulos */

        h2 {
            margin: 0 0 var(--space-large);
            font-size: 19px;
            line-height: 1.3;
        }

        h3 {
            font-size: 16px;
        }

        /* Formulários */

        .form-group {
            margin-bottom: var(--space-large);
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            min-height: 46px;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: var(--radius);
            background: var(--color-surface);
            color: var(--color-text);
            font-family: inherit;
            font-size: 16px;
        }

        textarea {
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: 2px solid #888;
            outline-offset: 1px;
            border-color: var(--color-primary);
        }

        /* Botões */

        button,
        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 42px;
            padding: 9px 12px;
            border: 1px solid transparent;
            border-radius: var(--radius);
            background: var(--color-primary);
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            line-height: 1.3;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }

        button:active,
        .button:active {
            opacity: 0.85;
        }

        /* Botão de exclusão */

        .delete-button {
            background: var(--color-danger);
            color: #fff;
        }

        /* Cards */

        .card {
            padding: var(--space-large);
            margin-bottom: var(--space-medium);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            background: var(--color-surface);
        }

        /* Lista */

        .list {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .list-item {
            padding: var(--space-medium) 0;
            border-bottom: 1px solid var(--color-border);
        }

        .list-item:last-child {
            border-bottom: none;
        }

        /* Espaçamentos */

        .section {
            margin-bottom: 24px;
        }

        /* Navegação inferior */

        .nav {
            display: flex;
            gap: var(--space-small);
            padding: var(--space-medium) var(--space-large);
            border-top: 1px solid var(--color-border);
            background: var(--color-surface);
        }

        .nav a {
            display: flex;
            flex: 1;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 8px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            background: #f7f7f7;
            color: var(--color-text);
            font-size: 14px;
            text-align: center;
            text-decoration: none;
        }

        .nav a:active {
            background: #e9e9e9;
        }

        /* Leitor de código de barras */

        #reader {
            width: 100%;
            margin: 0 auto;
            overflow: hidden;
            border-radius: var(--radius);
            background: #000;
        }

        #reader video {
            width: 100% !important;
            height: 220px !important;
            object-fit: cover !important;
        }

        @media (max-width: 600px) {
            #reader video {
                height: 180px !important;
            }
        }

        /* Desktop */

        @media (min-width: 601px) {
            body {
                padding: 24px 0;
            }

            .app {
                min-height: calc(100vh - 48px);
                overflow: hidden;
                border-radius: 8px;
            }
        }
        </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

<div class="app">

    <header class="header">
        <h1>{% block header_title %}Mercado{% endblock %}</h1>

        <p>{% block header_subtitle %}{% endblock %}</p>
    </header>

    <main class="content">
        {% block content %}
        {% endblock %}
    </main>

    <nav class="nav">
        <a href="/mercado/stock/">Estoque</a>
        <a href="/mercado/scan/">Venda</a>
    </nav>

</div>

{% block extra_js %}
{% endblock %}

</body>
</html>
